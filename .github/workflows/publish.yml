name: Publish report

# Step two of the report flow: a work/<id>/points.json appears (written by the browser, using the
# submitter's DeepSeek key) and this turns it into a report plus a refreshed index. The reports
# embed the YouTube player and carry no video files, which is the only shape a runner can build.
on:
  push:
    paths:
      - "work/*/points.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build every report that has points
        run: bash tools/build-reports.sh

      - name: Commit the reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports index.html _added.json
          git diff --cached --quiet && exit 0
          git commit -m "report: build from points.json [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $attempt failed, retrying"; sleep 5
          done
