name: yt-dlp probe

# Answers one question before anything else gets built: can a GitHub-hosted runner talk to
# YouTube at all, and can it pull a few seconds of video? Datacenter IPs are the usual reason
# this fails, so it has to be measured on the runner rather than assumed.
on:
  workflow_dispatch:
  push:
    paths:
      - "probe/**"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          echo "runner ip: $(curl -s https://ipinfo.io/ip)"
          curl -s https://ipinfo.io/json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('org'),'|',d.get('city'),d.get('country'))" || true
          python3 --version; node --version; ffmpeg -version | head -1
          command -v deno || echo "deno: not installed"

      # yt-dlp needs a JavaScript runtime to solve YouTube's n/sig challenges. Its default is
      # deno, which the runner image does not ship - without this the download half of the
      # pipeline reports "No video formats found!".
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp (standalone binary)
        run: |
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp-standalone
          chmod +x /usr/local/bin/yt-dlp-standalone
          yt-dlp-standalone --version

      - name: Probe
        continue-on-error: true
        run: YTDLP=yt-dlp-standalone bash probe/run-probe.sh standalone

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe
          git diff --cached --quiet && exit 0
          git commit -m "probe: yt-dlp results [skip ci]"
          # A human push during a run would otherwise make this fail with a non-fast-forward.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
